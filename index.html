    --rosa-fundo: #fbe9ee;
    --rosa-destaque: #e0507a;
    --texto-escuro: #2b1c22;
    --branco: #ffffff;
    --cinza-linha: #eaeaea;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{
    background-color: var(--rosa-fundo);
    font-family: 'Poppins', Arial, Helvetica, sans-serif;
    font-weight:700;
    color: var(--texto-escuro);
    -webkit-font-smoothing:antialiased;
  }

  /* ===== CABEÇALHO ===== */
  header{
    background-color: var(--branco);
    text-align:center;
    padding: 18px 16px;
    border-bottom: 1px solid var(--cinza-linha);
  }

  header h1{
    font-size: clamp(16px, 4.2vw, 22px);
    line-height:1.35;
    letter-spacing:0.2px;
    text-transform:uppercase;
  }

  header h1 .data-destaque{
    color: var(--rosa-destaque);
  }

  /* ===== VSL ===== */
  main{
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 16px 40px;
  }

  .vsl-container{
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    background:#000;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }

  /* ===== RODAPÉ ===== */
  footer{
    text-align:center;
    padding: 24px 16px 32px;
    border-top: 1px solid var(--cinza-linha);
  }

  footer .footer-links{
    font-size:12px;
    margin-bottom:10px;
  }

  footer .footer-links a{
    color: var(--texto-escuro);
    text-decoration:none;
  }

  footer .footer-links a:hover{
    text-decoration:underline;
  }

  footer .separador{
    margin:0 8px;
    color:#c9c9c9;
  }

  footer .footer-copy{
    font-size:11px;
    color:#7a6a70;
    font-weight:400;
    font-family: Arial, Helvetica, sans-serif;
  }

  footer .footer-copy a{
    color:#7a6a70;
    text-decoration:none;
  }

  footer .footer-copy a:hover{
    text-decoration:underline;
  }
</style>

<script>
  // Mostra sempre a data atual no formato DD/MM/AAAA
  (function(){
    var hoje = new Date();
    var dia = String(hoje.getDate()).padStart(2, '0');
    var mes = String(hoje.getMonth() + 1).padStart(2, '0');
