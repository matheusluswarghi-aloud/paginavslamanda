  .vsl-container{

    width:100%;
    border-radius:14px;

  /* ===== RODAPÉ ===== */

  footer .footer-links a{

  }

  footer .footer-links a:hover{

  }

  footer .separador{

  footer .footer-copy{

    color:#7a6a70;
    font-weight:400;

  }

  footer .footer-copy a{

    text-decoration:none;

<script>
  // Mostra sempre a data atual no formato DD/MM/AAAA
  (function(){
    var hoje = new Date();
    var dia = String(hoje.getDate()).padStart(2, '0');
    var mes = String(hoje.getMonth() + 1).padStart(2, '0');
    var ano = hoje.getFullYear();
    document.getElementById('data-hoje').textContent = dia + '/' + mes + '/' + ano;
  })();
</script>

<script>
  // Evento PlayVSL: o primeiro clique na pagina e o que inicia a VSL de verdade
  // (o player fica mudo ate a pessoa clicar). Serve para medir play rate real,
  // cruzando PlayVSL com landing page views.
  (function(){
    var CHAVE = 'playvsl_enviado';
    if (sessionStorage.getItem(CHAVE)) return;

    function enviar(){
      if (sessionStorage.getItem(CHAVE)) return;
      // O fbq e injetado em runtime pela UTMify, nao esta no HTML. Se o clique
      // vier antes do script carregar, deixa o listener vivo e tenta no proximo.
      if (typeof window.fbq !== 'function') return;
      // Evento padrao em vez de trackCustom: o Meta suprime evento personalizado
      // nao declarado na conta. FindLocation nao e usado neste funil, entao nao
      // colide com PageView/ViewContent/AddToCart/InitiateCheckout/Purchase/
      // Lead/CompleteRegistration. O content_name identifica o play.
      window.fbq('track', 'FindLocation', { content_name: 'PlayVSL' });
      sessionStorage.setItem(CHAVE, '1');
      document.removeEventListener('click', enviar, true);
      document.removeEventListener('touchend', enviar, true);
    }

    document.addEventListener('click', enviar, true);
    document.addEventListener('touchend', enviar, true);
  })();
</script>
